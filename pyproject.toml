[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "-m", "not integration",
]
markers = [
    "integration: pruebas que requieren red/IOTA/broker MQTT (excluir con -m 'not integration",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]
